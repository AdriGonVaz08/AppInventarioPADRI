<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - PADRI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="vista-principal" class="container">
        <header>
            <h1>Inventario de Productos</h1>
            <div class="controles">
                <input type="text" id="buscador" placeholder=" Buscar por nombre...">
                <select id="ordenar">
                    <option value="asc">A-Z (Ascendente)</option>
                    <option value="desc">Z-A (Descendente)</option>
                </select>
                <button id="btn-abrir-crear" class="btn-primario">+ Nuevo Artículo</button>
            </div>
        </header>

        <div id="contenedor-articulos" class="grid-articulos">
            </div>
    </section>

    <section id="vista-formulario" class="container oculto">
        <div class="card-form">
            <h2 id="titulo-formulario">Gestión de Artículo</h2>
            <form id="form-articulo">
                <input type="hidden" id="articulo-id">
                
                <div class="grupo-input">
                    <label for="input-nombre">Nombre del Artículo</label>
                    <input type="text" id="input-nombre" placeholder="Ej. Monitor Pro" required>
                </div>

                <div class="grupo-input">
                    <label for="input-stock">Stock Disponible</label>
                    <input type="number" id="input-stock" placeholder="0" required min="0">
                </div>

                <!-- ESTA ES LA PARTE QUE HE CORREGIDO -->
                <div class="grupo-input">
                    <label for="input-imagen">Imagen del Producto</label>
                    <input type="file" id="input-imagen" accept="image/*" required>
                </div>
                <!-- ------------------------------ -->

                <div class="botones-form">
                    <button type="submit" class="btn-guardar">Guardar Cambios</button>
                    <button type="button" id="btn-cancelar" class="btn-cancelar">Volver a Principal</button>
                </div>
            </form>
        </div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
